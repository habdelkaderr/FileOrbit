name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Locked mode: fails if any NuGet package differs from packages.lock.json (version or content hash).
      - name: Restore (locked)
        shell: pwsh
        run: |
          $output = dotnet restore --locked-mode 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            # Surface restore errors as annotations so they are visible on the run summary.
            $output | Select-String -Pattern 'error' | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Build
        run: dotnet build --no-restore -c Release

      # Microsoft Office is not available on hosted runners; those tests skip themselves when Office is
      # missing, and the trait filter keeps the run fast.
      - name: Test
        shell: pwsh
        run: |
          # Each test group runs in its own process, so a crash at process exit is attributed to its group.
          $failed = @()
          foreach ($group in 'FileOrbit.Tests.Unit', 'FileOrbit.Tests.Integration', 'FileOrbit.Tests.Visual') {
            $output = dotnet test --no-build -c Release -- --filter-not-trait "Category=Office" --filter-namespace $group 2>&1
            $code = $LASTEXITCODE
            $output | Write-Host
            if ($code -ne 0) {
              $failed += $group
              $lines = @($output | ForEach-Object { "$_" -replace "`e\[[0-9;]*m", "" })
              for ($i = 0; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^\s*failed ') { Write-Host "::error::[$group] $($lines[$i].Trim()) -- $(($lines[($i+1)..($i+3)] -join ' ').Trim())" }
              }
              $summary = ($lines | Where-Object { $_ -match 'total:|succeeded:|failed:|exit code' }) -join ' / '
              Write-Host "::error::[$group] exit code $code. $summary"
            }
          }
          if ($failed.Count -gt 0) { exit 1 }

      # If the test host crashed, report which module faulted (from Windows Error Reporting) as annotations.
      - name: Crash diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -LogName Application -MaxEvents 50 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error', '.NET Runtime', 'Windows Error Reporting' -and $_.TimeCreated -gt (Get-Date).AddMinutes(-30) } |
            Select-Object -First 4 |
            ForEach-Object { $text = ($_.Message -replace "`r?`n", ' | '); Write-Host "::error::$($_.ProviderName): $($text.Substring(0, [Math]::Min(900, $text.Length)))" }

      # Catch packaging problems (WiX validation runs here, as the runner is elevated) before a release.
      - name: Build installer and portable zip
        shell: pwsh
        run: ./build/Build-Installer.ps1
