name: Release

# Builds the portable download on GitHub's servers from the tagged source, so the published zip is
# traceable to this exact commit. Create a release with:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # sign the build provenance attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        shell: pwsh
        run: |
          $output = dotnet test --no-build -c Release -- --filter-not-trait "Category=Office" 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            # Surface failing tests (name + first message line) as annotations on the run summary.
            $lines = @($output | ForEach-Object { "$_" -replace "`e\[[0-9;]*m", "" })
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^\s*failed ') { Write-Host "::error::$($lines[$i].Trim()) -- $(($lines[($i+1)..($i+3)] -join ' ').Trim())" }
            }
            $lines | Select-Object -Last 12 | Where-Object { $_.Trim() } | ForEach-Object { Write-Host "::error::$($_.Trim())" }
            exit 1
          }

      - name: Build installer, portable folder and zip
        shell: pwsh
        run: ./build/Build-Installer.ps1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/FileOrbit-*-x64.msi
            artifacts/FileOrbit-*-win-x64.zip
            artifacts/FileOrbit-*-win-x64/FileOrbit.exe

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Name -match '^FileOrbit-.*-(x64\.msi|win-x64\.zip)(\.sha256)?$' }
          $lines = $files | Where-Object Extension -eq '.sha256' | ForEach-Object { $h, $n = (Get-Content $_.FullName).Split('  '); "- ``$n``: ``$h``" }
          $notes = @(
            "**Installer (recommended):** download the ``.msi`` and double-click it. Installs for your user account, no administrator password needed."
            ""
            "**Portable:** download the ``.zip``, right-click it > Extract All, then run FileOrbit.exe."
            ""
            "Requires 64-bit Windows 10 (2004+) or Windows 11. Built by GitHub Actions from commit $env:GITHUB_SHA."
            ""
            "SHA-256 fingerprints:"
            $lines
            ""
            "Verify a download came from this repository's build: ``gh attestation verify <file> --repo $env:GITHUB_REPOSITORY``"
            ""
            "FileOrbit is not code-signed yet: Windows may show ""Windows protected your PC"" (More info > Run anyway)."
          ) -join "`n"
          gh release create $env:TAG ($files.FullName) --title "FileOrbit $env:TAG" --notes $notes
